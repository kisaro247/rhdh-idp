---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: rhdh-k8s-sa
  namespace: rhdh-demo
---
apiVersion: v1
kind: Secret
metadata:
  name: rhdh-k8s-sa-token
  namespace: rhdh-demo
  annotations:
    kubernetes.io/service-account.name: rhdh-k8s-sa
type: kubernetes.io/service-account-token
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: rhdh-k8s-sa-view
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: view
subjects:
  - kind: ServiceAccount
    name: rhdh-k8s-sa
    namespace: rhdh-demo
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: rhdh-tekton-reader
  namespace: rhdh-demo
rules:
  - apiGroups: ["tekton.dev"]
    resources: ["pipelineruns", "taskruns"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: rhdh-tekton-reader-binding
  namespace: rhdh-demo
subjects:
  - kind: ServiceAccount
    name: rhdh-k8s-sa
    namespace: rhdh-demo
roleRef:
  kind: Role
  name: rhdh-tekton-reader
  apiGroup: rbac.authorization.k8s.io
