---
apiVersion: rhdh.redhat.com/v1alpha3
kind: Backstage
metadata:
  name: developer-hub
  namespace: rhdh-demo
  labels:
    app.kubernetes.io/name: backstage
spec:
  database:
    enableLocalDb: true
  application:
    dynamicPluginsConfigMapName: dynamic-plugins-rhdh
    appConfig:
      configMaps:
        - name: app-config-rhdh
      mountPath: /opt/app-root/src
    extraEnvs:
      envs:
        - name: NODE_TLS_REJECT_UNAUTHORIZED
          value: "0"
      secrets:
        - name: rhdh-secrets            
    replicas: 0 #1
    route:
      enabled: true
      host: rhdh.apps.dev02.ocp.consol.de
      subdomain: apps.cluster-xg2zk.dynamic.redhatworkshops.io
