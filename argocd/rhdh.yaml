---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: devhub-deploy
  namespace: openshift-gitops
spec:
  destination:
    namespace: openshift-gitops
    server: https://kubernetes.default.svc
  project: default
  source:
    path: rhdh
    repoURL: https://github.com/kisaro247/rhdh-idp.git
    targetRevision: phase-3-work
  syncPolicy:
    automated:
      selfHeal: false
      prune: false
    syncOptions:
      - CreateNamespace=true
...
