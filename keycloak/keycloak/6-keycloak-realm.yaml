---
apiVersion: k8s.keycloak.org/v2alpha1
kind: KeycloakRealmImport
metadata:
  name: rhdh-realm
  namespace: rhdh-demo
spec:
  keycloakCRName: demo-keycloak-instance
  realm:
    id: rhdh
    realm: rhdh
    displayName: "RHDH Realm"
    enabled: true
    browserFlow: browser
    identityProviders:
      - alias: github
        displayName: "GitHub"
        providerId: github
        enabled: true
        trustEmail: true
        storeToken: false
        addReadTokenRoleOnCreate: false
        authenticateByDefault: false
        linkOnly: false
        firstBrokerLoginFlowAlias: first broker login
        config:
          clientId: "Ov23lisUuZaG6GfvBVfV"
          clientSecret: "8c1540bd3882e35a99922a576092c24f5f6f5883"
          defaultScope: "user:email"
    clients:
      - clientId: rhdh
        name: rhdh
        description: Red Hat Developer Hub Client
        enabled: true
        protocol: openid-connect
        publicClient: false
        redirectUris:
          - "https://rhdh.apps.dev02.ocp.consol.de/api/auth/*"
        rootUrl: "https://rhdh.apps.dev02.ocp.consol.de"
        adminUrl: "https://rhdh.apps.dev02.ocp.consol.de"
        baseUrl: "https://rhdh.apps.dev02.ocp.consol.de"
        webOrigins:
          - "+"
        secret: "developer-hub-secret"
        standardFlowEnabled: true
        implicitFlowEnabled: false
        directAccessGrantsEnabled: false
        serviceAccountsEnabled: false
        authorizationServicesEnabled: false
...
